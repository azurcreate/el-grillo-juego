<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El Grillo y su Viaje - Juego DidáłŁctico Infantil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family:'Nunito',sans-serif; background-color:#1a202c; margin:0; overflow:hidden; touch-action:none; user-select:none; }
        :root { --bordo-marron:#5e2118; --granate:#800020; --verde-prado:#40916c; --cielo-alto:#3a86ff; --cielo-bajo:#bae6fd; }
        #game-container { background:linear-gradient(to bottom,var(--cielo-alto) 0%,var(--cielo-bajo) 40%,#74c69d 40%,var(--verde-prado) 100%); position:relative; overflow:hidden; }
        .cloud-animated { position:absolute; animation:moveClouds linear infinite; }
        @keyframes moveClouds { 0% {transform:translateX(-150px)} 100% {transform:translateX(100vw)} }
        .sun-glow { animation:pulseSun 3s ease-in-out infinite alternate; }
        @keyframes pulseSun { 0% {transform:scale(1);filter:drop-shadow(0 0 15px #fde047)} 100% {transform:scale(1.1);filter:drop-shadow(0 0 25px #facc15)} }
        .sprite { position:absolute;display:flex;align-items:center;justify-content:center;filter:drop-shadow(3px 5px 4px rgba(0,0,0,.3));z-index:10; }
        .d-pad-btn { background:#f8fafc;border:3px solid var(--bordo-marron);color:var(--bordo-marron);border-radius:14px;box-shadow:0 4px 0 var(--granate);font-size:22px;display:flex;align-items:center;justify-content:center; }
        .d-pad-btn:active,.btn-granate:active { transform:translateY(4px);box-shadow:0 0 0 var(--granate); }
        .btn-granate { background:linear-gradient(to bottom,var(--granate),var(--bordo-marron));color:#fff;border:2px solid #3f1610;box-shadow:0 4px 0 #3f1610; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center bg-slate-900">
<div class="w-full max-w-5xl bg-white p-3 flex justify-between items-center z-20 border-b-4" style="border-color:var(--granate)"><h1 id="level-title" class="text-base md:text-2xl font-black" style="color:var(--bordo-marron)">🌱 Nivel 1: El Prado del Grillo</h1><div class="flex items-center gap-3 font-bold text-sm md:text-lg"><span id="suitcases-ui" style="color:var(--granate)">🧳 Valijas: 0/3</span><span id="progress-ui" class="text-amber-800 hidden">📍 Destino: 1 de 4</span><button id="audio-toggle" onclick="AudioEngine.toggleMute()" class="bg-amber-100 border-2 border-amber-600 rounded-lg px-2 py-1 text-xl" title="Activar/Silenciar Sonido">🔊</button></div></div>
<div id="game-container" class="w-full max-w-5xl flex-1 border-x-4 shadow-2xl relative" style="border-color:var(--bordo-marron)"><div class="absolute top-4 right-8 text-6xl sun-glow z-0">☀️</div><div class="cloud-animated text-4xl top-8 z-0" style="animation-duration:35s">☁️</div><div class="cloud-animated text-5xl top-16 z-0" style="animation-duration:45s;animation-delay:-15s">☁️</div><div class="absolute top-[32%] w-full flex justify-between px-10 text-3xl opacity-80 z-0"><span>⛰️</span><span>🏡 ⛪ 🏡</span><span>🏔️</span></div><div class="absolute top-[42%] left-[8%] text-5xl z-1">🌳</div><div class="absolute top-[40%] left-[48%] text-4xl z-1">🌲</div><div class="absolute top-[43%] right-[12%] text-5xl z-1">🌳</div><div class="absolute bottom-[20%] left-[25%] text-2xl z-1">🌼</div><div class="absolute bottom-[10%] left-[60%] text-2xl z-1">🌻</div><div class="absolute bottom-[25%] right-[20%] text-2xl z-1">🌼</div><div id="valija-1" class="sprite text-3xl" style="left:18%;top:65%">🧳</div><div id="valija-2" class="sprite text-3xl" style="left:52%;top:78%">🧳</div><div id="valija-3" class="sprite text-3xl" style="left:82%;top:60%">🧳</div><div id="mosquito" class="sprite text-5xl" style="left:35%;top:68%">🦟</div><div id="vaca" class="sprite text-7xl hidden" style="left:78%;top:58%">🐄</div><div id="dest-1" class="sprite text-6xl hidden opacity-90" style="left:25%;top:55%">🏙️<span class="absolute -top-6 text-xs bg-white px-2 py-0.5 rounded border border-gray-400 font-bold">Ciudad</span></div><div id="dest-2" class="sprite text-6xl hidden opacity-90" style="left:50%;top:55%">🏔️<span class="absolute -top-6 text-xs bg-white px-2 py-0.5 rounded border border-gray-400 font-bold">Montańa</span></div><div id="dest-3" class="sprite text-6xl hidden opacity-90" style="left:72%;top:55%">🏖️<span class="absolute -top-6 text-xs bg-white px-2 py-0.5 rounded border border-gray-400 font-bold">Playa</span></div><div id="dest-4" class="sprite text-6xl hidden opacity-90" style="left:90%;top:55%">🏰<span class="absolute -top-6 text-xs bg-white px-2 py-0.5 rounded border border-gray-400 font-bold">Castillo</span></div><div id="player" class="sprite text-5xl z-30" style="left:60px;top:62%">🦗</div></div>
<div class="w-full max-w-5xl bg-slate-200 p-3 flex justify-center items-center gap-4 border-t-4" style="border-color:var(--granate)"><div class="grid grid-cols-3 gap-2 w-48 h-32"><div></div><button class="d-pad-btn" ontouchstart="setKey('ArrowUp',true)" ontouchend="setKey('ArrowUp',false)" onmousedown="setKey('ArrowUp',true)" onmouseup="setKey('ArrowUp',false)">⬆️</button><div></div><button class="d-pad-btn" ontouchstart="setKey('ArrowLeft',true)" ontouchend="setKey('ArrowLeft',false)" onmousedown="setKey('ArrowLeft',true)" onmouseup="setKey('ArrowLeft',false)">⬅️</button><button class="d-pad-btn" ontouchstart="setKey('ArrowDown',true)" ontouchend="setKey('ArrowDown',false)" onmousedown="setKey('ArrowDown',true)" onmouseup="setKey('ArrowDown',false)">⬇️</button><button class="d-pad-btn" ontouchstart="setKey('ArrowRight',true)" ontouchend="setKey('ArrowRight',false)" onmousedown="setKey('ArrowRight',true)" onmouseup="setKey('ArrowRight',false)">➡️</button></div><div class="text-xs md:text-sm font-bold text-slate-700 text-center uppercase tracking-wide">Usa las flechas<br>para moverte y saltar</div></div>
<div id="dialog-overlay" class="absolute inset-0 bg-black/75 flex items-center justify-center p-4 z-50 hidden backdrop-blur-sm"><div class="bg-white rounded-2xl p-6 md:p-8 max-w-lg w-full text-center shadow-2xl border-4" style="border-color:var(--bordo-marron)"><h2 id="dialog-title" class="text-2xl md:text-3xl font-black mb-3" style="color:var(--granate)">TíŁ´tulo</h2><p id="dialog-text" class="text-base md:text-lg text-slate-700 mb-6 font-semibold leading-relaxed">Mensaje</p><div id="dialog-options" class="flex flex-col gap-2.5"></div></div></div>
<script>
const AudioEngine={ctx:null,isMuted:false,bgmTimer:null,bgmStep:0,hopCooldown:0,init(){if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;this.ctx=new A()}if(this.ctx.state==='suspended')this.ctx.resume();if(!this.bgmTimer&&!this.isMuted)this.startBGM()},toggleMute(){this.isMuted=!this.isMuted;const b=document.getElementById('audio-toggle');if(this.isMuted){b.innerText='🔇';this.stopBGM()}else{b.innerText='🔊';this.init();this.startBGM()}},tone(freq,d=.12,type='sine',vol=.15){if(this.isMuted||!this.ctx)return;const n=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,n);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(this.ctx.destination);o.start(n);o.stop(n+d)},playHop(){const n=this.ctx?.currentTime||0;if(n<this.hopCooldown)return;this.hopCooldown=n+.22;this.tone(550,.12)},playPickup(){[523.25,659.25,783.99,1046.50].forEach((f,i)=>setTimeout(()=>this.tone(f,.25,'triangle',.2),i*60))},playCorrect(){[440,554.37,659.25,880].forEach((f,i)=>setTimeout(()=>this.tone(f,.3,'sine',.25),i*80))},playWrong(){this.tone(220,.2,'sawtooth');setTimeout(()=>this.tone(180,.2,'sawtooth'),150)},playMoo(){this.tone(130,.65,'sawtooth',.2)},playVictory(){[523.25,659.25,783.99,1046.50,880,1046.50].forEach((f,i)=>setTimeout(()=>this.tone(f,.3,'triangle',.25),i*180))},playDialog(){this.tone(600,.05,'sine',.1)},startBGM(){if(this.bgmTimer)return;const notes=[261.63,329.63,392.00,329.63,349.23,392.00,440.00,392.00];this.bgmTimer=setInterval(()=>{if(!this.isMuted&&this.ctx)this.tone(notes[this.bgmStep++%notes.length],.35,'sine',.04)},400)},stopBGM(){clearInterval(this.bgmTimer);this.bgmTimer=null}};
const unlockAudio=()=>{AudioEngine.init();window.removeEventListener('click',unlockAudio);window.removeEventListener('touchstart',unlockAudio);window.removeEventListener('keydown',unlockAudio)};window.addEventListener('click',unlockAudio);window.addEventListener('touchstart',unlockAudio);window.addEventListener('keydown',unlockAudio);
const player=document.getElementById('player'),container=document.getElementById('game-container'),keys={ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false};let gameState='LEVEL_1',playerPos={x:60,y:300},suitcases=0,talkedToMosquito=false,currentDestinationIndex=0;const speed=4.5;const questions=[{q:'1. ¿QuéłŁ hizo el grillo cuando quiso viajar?',options:[['Se quedo en casa sin hacer nada.',false],['Le pidio ayuda a su amigo el mosquito.',true],['Se compro un avion y viajo solo.',false]]},{q:'2. ¿QuiéłŁn lo ayudo finalmente a viajar por el mundo?',options:[['Una mariposa que le presto sus alas.',false],['Una vaca generosa que lo subio a su lomo.',true],['Una hormiga trabajadora.',false]]},{q:'3. ¿Por qué es importante la generosidad de la Señora Vaca?',options:[['Nos hace felices y ayuda a otros a cumplir sus sueños.',true],['Porque nos da dinero.',false],['Porque nos lleva a la escuela.',false]]},{q:'4. ¿QuéłŁ aprendiste de esta historia?',options:[['Que la amistad y la generosidad son valores importantes.',true],['Que los grillos no pueden viajar.',false],['Que las vacas no hablan.',false]]}];
function setKey(k,v){if(k in keys)keys[k]=v}document.addEventListener('keydown',e=>{if(e.key in keys){keys[e.key]=true;e.preventDefault()}});document.addEventListener('keyup',e=>{if(e.key in keys){keys[e.key]=false;e.preventDefault()}});
function showDialog(title,text,options,callback){document.getElementById('dialog-title').innerText=title;document.getElementById('dialog-text').innerText=text;const c=document.getElementById('dialog-options');c.innerHTML='';options.forEach((o,i)=>{const b=document.createElement('button');b.innerText=o;b.className='btn-granate py-3 px-6 rounded-xl font-bold text-lg transition-transform';b.onclick=()=>callback(i);c.appendChild(b)});document.getElementById('dialog-overlay').classList.remove('hidden');AudioEngine.playDialog()}function hideDialog(){document.getElementById('dialog-overlay').classList.add('hidden')}
function startQuestionPhase(){gameState='QUESTION';const q=questions[currentDestinationIndex];showDialog('📝 ¡Pregunta de viaje!',q.q,q.options.map(x=>x[0]),i=>{if(q.options[i][1]){AudioEngine.playCorrect();showDialog('Correcto!','Muy bien! El grillo puede continuar su viaje.',['Seguir!','Terminar'],c=>{if(c===0){currentDestinationIndex=(currentDestinationIndex+1)%4;gameState='LEVEL_2';hideDialog()}else{AudioEngine.playVictory();showDialog('Gracias por jugar!','El grillo tuvo un viaje increible gracias a tu ayuda!',['Jugar de nuevo'],()=>location.reload())}})}else{AudioEngine.playWrong();showDialog('Casi...','Intenta nuevamente.',q.options.map(x=>x[0]),()=>startQuestionPhase())}})}
function unlockDestinations(){gameState='LEVEL_2';document.getElementById('progress-ui').classList.remove('hidden');['dest-1','dest-2','dest-3','dest-4'].forEach(x=>document.getElementById(x).classList.remove('hidden'));showDialog('Valijas listas!','Recolectaste las 3 valijas! A donde quiere viajar el grillo?',['Ciudad','Montana','Playa','Castillo'],i=>{currentDestinationIndex=i;startQuestionPhase()})}
function checkCollisions(){const p=player.getBoundingClientRect();for(let i=1;i<=3;i++){const v=document.getElementById('valija-'+i);if(v&&!v.classList.contains('hidden')){const r=v.getBoundingClientRect();if(p.left<r.right&&p.right>r.left&&p.top<r.bottom&&p.bottom>r.top){v.classList.add('hidden');suitcases++;document.getElementById('suitcases-ui').innerText='🧳 Valijas: '+suitcases+'/3';AudioEngine.playPickup();if(suitcases===3)unlockDestinations()}}}const m=document.getElementById('mosquito');if(m&&!talkedToMosquito){const r=m.getBoundingClientRect();if(p.left<r.right&&p.right>r.left&&p.top<r.bottom&&p.bottom>r.top){talkedToMosquito=true;showDialog('🦟 Hola Grillo!','Para viajar lejos necesitamos ayuda de nuestros amigos.',['Entiendo!'],()=>hideDialog())}}}
function loop(){if(gameState==='LEVEL_1'){if(keys.ArrowLeft){playerPos.x=Math.max(0,playerPos.x-speed);AudioEngine.playHop()}if(keys.ArrowRight){playerPos.x=Math.min(container.offsetWidth-50,playerPos.x+speed);AudioEngine.playHop()}if(keys.ArrowUp){playerPos.y=Math.max(0,playerPos.y-speed);AudioEngine.playHop()}if(keys.ArrowDown){playerPos.y=Math.min(container.offsetHeight-50,playerPos.y+speed);AudioEngine.playHop()}player.style.left=playerPos.x+'px';player.style.top=playerPos.y+'px';checkCollisions()}requestAnimationFrame(loop)}loop();
</script></body></html>
