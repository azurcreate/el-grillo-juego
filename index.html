        :root {
            --bordo-marron: #5e2118;
            --granate: #800020;
            --verde-prado: #40916c;
            --cielo-alto: #3a86ff;
            --cielo-bajo: #bae6fd;
        }

        /* Escenario Base */
        #game-container {
            background: linear-gradient(to bottom, var(--cielo-alto) 0%, var(--cielo-bajo) 40%, #74c69d 40%, var(--verde-prado) 100%);
            position: relative;
            overflow: hidden;
        }

        /* Nubes Animadas */
        .cloud-animated {
            position: absolute;
            animation: moveClouds linear infinite;
        }
        @keyframes moveClouds {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(100vw); }
        }

        /* Sol Radiante */
        .sun-glow {
            animation: pulseSun 3s ease-in-out infinite alternate;
        }
        @keyframes pulseSun {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px #fde047); }
            100% { transform: scale(1.1); filter: drop-shadow(0 0 25px #facc15); }
        }

        /* Animación de Saltitos para el Grillo al Moverse */
        .hopping {
            animation: hop 0.25s infinite alternate ease-out;
        }
        @keyframes hop {
            0% { transform: translateY(0) scale(var(--flip-x, 1), 1); }
            100% { transform: translateY(-16px) scale(var(--flip-x, 1), 1); }
        }

    <!-- SCRIPT DE AUDIO SINTETIZADO EN TIEMPO REAL -->
    <script>
        const AudioEngine = {
            ctx: null,
            isMuted: false,
            bgmTimer: null,
            bgmStep: 0,
            hopCooldown: 0,

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                if (!this.bgmTimer && !this.isMuted) {
                    this.startBGM();
                }
            },

            toggleMute() {
                this.isMuted = !this.isMuted;
                const btn = document.getElementById('audio-toggle');
                if (this.isMuted) {
                    btn.innerText = '🔇';
                    this.stopBGM();
                } else {
                    btn.innerText = '🔊';
                    this.init();
                    this.startBGM();
                }
            },

            // EFECTO: Salto del Grillo (Pitch Bend subida rapida)
            playHop() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                if (now < this.hopCooldown) return;
                this.hopCooldown = now + 0.22;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(780, now + 0.12);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.12);
            },

            // EFECTO: Recolección de Valija (Campana / Chime brillante)
            playPickup() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + (i * 0.06));

                    gain.gain.setValueAtTime(0.2, now + (i * 0.06));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.06) + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + (i * 0.06));
                    osc.stop(now + (i * 0.06) + 0.25);
                });
            },

            // EFECTO: Respuesta Correcta (Fanfarria alegre)
            playCorrect() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);

                    gain.gain.setValueAtTime(0.25, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
            },

            // EFECTO: Respuesta Incorrecta (Tono suave doble)
            playWrong() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                [220, 180].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.15);

                    gain.gain.setValueAtTime(0.15, now + idx * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + idx * 0.15);
                    osc.stop(now + idx * 0.15 + 0.2);
                });
            },

            // EFECTO: Encuentro Vaca / Subida al Lomo
            playMoo() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(130, now);
                osc.frequency.linearRampToValueAtTime(160, now + 0.2);
                osc.frequency.linearRampToValueAtTime(110, now + 0.6);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.65);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.65);
            },

            // EFECTO: Victoria Final
            playVictory() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const melody = [523.25, 659.25, 783.99, 1046.50, 880, 1046.50];
                const durations = [0.15, 0.15, 0.15, 0.3, 0.2, 0.5];

                let timeAcc = now;
                melody.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, timeAcc);

                    gain.gain.setValueAtTime(0.25, timeAcc);
                    gain.gain.exponentialRampToValueAtTime(0.001, timeAcc + durations[i]);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(timeAcc);
                    osc.stop(timeAcc + durations[i]);

                    timeAcc += durations[i] + 0.03;
                });
            },

            // EFECTO: Sonido Pop Diálogo
            playDialog() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.05);
            },

            // MUSICA DE FONDO (Melodía alegre en bucle)
            startBGM() {
                if (this.bgmTimer) return;
                const bgmNotes = [261.63, 329.63, 392.00, 329.63, 349.23, 392.00, 440.00, 392.00];
                this.bgmStep = 0;

                this.bgmTimer = setInterval(() => {
                    if (this.isMuted || !this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(bgmNotes[this.bgmStep], now);

                    gain.gain.setValueAtTime(0.04, now); // Volumen suave de fondo
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.35);

                    this.bgmStep = (this.bgmStep + 1) % bgmNotes.length;
                }, 400);
            },

            stopBGM() {
                if (this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }
        };

        // Escuchar primera interacción global para activar AudioContext
        const unlockAudio = () => {
            AudioEngine.init();
            window.removeEventListener('click', unlockAudio);
            window.removeEventListener('touchstart', unlockAudio);
            window.removeEventListener('keydown', unlockAudio);
        };
        window.addEventListener('click', unlockAudio);
        window.addEventListener('touchstart', unlockAudio);
        window.addEventListener('keydown', unlockAudio);
    </script>

const joystickArea = document.getElementById('joystick-area');
const joystickBase = document.getElementById('joystick-base');
const joystickStick = document.getElementById('joystick-stick');
const jumpButton = document.getElementById('jump-button');

let joystickPointerId = null;

function resetJoystick() {
    setKey('ArrowLeft', false);
    setKey('ArrowRight', false);
    setKey('ArrowUp', false);
    setKey('ArrowDown', false);

    joystickStick.style.transform = 'translate(0, 0)';
}

function updateJoystick(event) {
    const rect = joystickBase.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let dx = event.clientX - centerX;
    let dy = event.clientY - centerY;

    const maxDistance = 25;
    const distance = Math.hypot(dx, dy);

    if (distance > maxDistance) {
        dx = (dx / distance) * maxDistance;
        dy = (dy / distance) * maxDistance;
    }

    joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;

    const threshold = 10;

    setKey('ArrowLeft', dx < -threshold);
    setKey('ArrowRight', dx > threshold);
    setKey('ArrowUp', dy < -threshold);
    setKey('ArrowDown', dy > threshold);
}

joystickArea.addEventListener('pointerdown', (event) => {
    joystickPointerId = event.pointerId;
    joystickArea.setPointerCapture(event.pointerId);
    updateJoystick(event);
    event.preventDefault();
});

joystickArea.addEventListener('pointermove', (event) => {
    if (event.pointerId === joystickPointerId) {
        updateJoystick(event);
        event.preventDefault();
    }
});

joystickArea.addEventListener('pointerup', (event) => {
    if (event.pointerId === joystickPointerId) {
        joystickPointerId = null;
        resetJoystick();
    }
});

joystickArea.addEventListener('pointercancel', resetJoystick);
joystickArea.addEventListener('lostpointercapture', resetJoystick);

jumpButton.addEventListener('pointerdown', (event) => {
    setKey('ArrowUp', true);
    AudioEngine.playHop();
    event.preventDefault();
});

jumpButton.addEventListener('pointerup', () => {
    setKey('ArrowUp', false);
});

jumpButton.addEventListener('pointercancel', () => {
    setKey('ArrowUp', false);
});
        // Bucle Principal
        function gameLoop() {
            if (gameState !== 'PAUSED') {
                movePlayer();
                checkCollisions();
            }
            requestAnimationFrame(gameLoop);
        }

        function movePlayer() {
            const rect = container.getBoundingClientRect();
            const playerSize = 60;
            const skyLimit = rect.height * 0.42;
            
            let isMoving = false;

            if (keys.ArrowUp && playerPos.y > skyLimit) { playerPos.y -= speed; isMoving = true; }
            if (keys.ArrowDown && playerPos.y < rect.height - playerSize) { playerPos.y += speed; isMoving = true; }
            if (keys.ArrowLeft && playerPos.x > 10) { playerPos.x -= speed; isMoving = true; setFacing('left'); }
            if (keys.ArrowRight && playerPos.x < rect.width - playerSize) { playerPos.x += speed; isMoving = true; setFacing('right'); }

            player.style.left = playerPos.x + 'px';
            player.style.top = playerPos.y + 'px';

            // Animación y Sonido de Saltos
            if (isMoving) {
                player.classList.add('hopping');
                AudioEngine.playHop();
            } else {
                player.classList.remove('hopping');
            }
        }

        // Orientación exacta del Grillo
        function setFacing(dir) {
            if (dir === 'right') {
                player.style.setProperty('--flip-x', '-1');
                player.style.transform = 'scaleX(-1)';
            } else if (dir === 'left') {
                player.style.setProperty('--flip-x', '1');
                player.style.transform = 'scaleX(1)';
            }
        }

        function checkCollisions() {
            const px = playerPos.x + 30;
            const py = playerPos.y + 30;

            if (gameState === 'LEVEL_1') {
                // Recolección de Valijas
                ['valija-1', 'valija-2', 'valija-3'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el && !el.classList.contains('hidden')) {
                        if (getDistance(px, py, el) < 45) {
                            el.classList.add('hidden');
                            suitcases++;
                            AudioEngine.playPickup();
                            document.getElementById('suitcases-ui').innerText = `🧳 Valijas: ${suitcases}/3`;
                            if (suitcases === 3) {
                                showMessage("¡Valijas Listas! 🧳", "Has recogido todo tu equipaje. Ve a hablar con tu amigo el Mosquito 🦟.");
                            }
                        }
                    }
                });

                // Diálogo con Mosquito
                const mosqEl = document.getElementById('mosquito');
                if (!talkedToMosquito && getDistance(px, py, mosqEl) < 55) {
                    if (suitcases < 3) {
                        showMessage("Mosquito dice: 🦟", "¡Hola Grillito! junta tus 3 valijas antes de salir a viajar.");
                        playerPos.x -= 25; 
                    } else {
                        talkedToMosquito = true;
                        showMessage("¡Gran Noticia! 🦟", "El Mosquito te aconseja: «En el campo hay una Vaca 🐄 y ella hace viajes gratuitos». ¡Búscala a la derecha del prado!");
                        document.getElementById('vaca').classList.remove('hidden');
                    }
                }

                // Transición al Nivel 2 al encontrar a la Vaca
                const vacaEl = document.getElementById('vaca');
                if (!vacaEl.classList.contains('hidden') && getDistance(px, py, vacaEl) < 65) {
                    AudioEngine.playMoo();
                    startLevel2();
                }
            } 
            else if (gameState === 'LEVEL_2') {
                // Llegada a Estaciones del Viaje
                const targetDest = document.getElementById(`dest-${currentDestinationIndex + 1}`);
                if (targetDest && !targetDest.classList.contains('visited')) {
                    if (getDistance(px, py, targetDest) < 60) {
                        askQuestion(currentDestinationIndex);
                    }
                }
            }
        }

        function getDistance(px, py, element) {
            const rect1 = container.getBoundingClientRect();
            const rect2 = element.getBoundingClientRect();
            const ex = (rect2.left - rect1.left) + (rect2.width / 2);
            const ey = (rect2.top - rect1.top) + (rect2.height / 2);
            return Math.hypot(px - ex, py - ey);
        }

        function startLevel2() {
            gameState = 'PAUSED';
            resetKeys();

            document.getElementById('level-title').innerText = "✈️ Nivel 2: El Gran Viaje por el Mundo";
            document.getElementById('suitcases-ui').classList.add('hidden');
            document.getElementById('progress-ui').classList.remove('hidden');

            // Ocultar Nivel 1
            document.getElementById('valija-1').classList.add('hidden');
            document.getElementById('valija-2').classList.add('hidden');
            document.getElementById('valija-3').classList.add('hidden');
            document.getElementById('mosquito').classList.add('hidden');
            document.getElementById('vaca').classList.add('hidden');

            // Mostrar Nivel 2
            document.getElementById('dest-1').classList.remove('hidden');
            document.getElementById('dest-2').classList.remove('hidden');
            document.getElementById('dest-3').classList.remove('hidden');
            document.getElementById('dest-4').classList.remove('hidden');

            // Grillo montado en la Vaca
            player.innerText = "🐄🦗";
            player.classList.replace('text-5xl', 'text-6xl');
            playerPos = { x: 40, y: container.getBoundingClientRect().height * 0.58 };

            showMessage("¡A Viajar! 🐄🦗", "La Señora Vaca ha subido al Grillito a su lomo.<br><br><b>Camina hacia la derecha</b> para visitar cada destino y responder las preguntas.");
        }

        function askQuestion(index) {
            gameState = 'PAUSED';
            resetKeys();
            AudioEngine.playDialog();

            const qData = questions[index];
            document.getElementById('dialog-overlay').classList.remove('hidden');
            document.getElementById('dialog-title').innerText = `📍 Destino ${index + 1}`;
            document.getElementById('dialog-text').innerText = qData.q;

            const optionsContainer = document.getElementById('dialog-options');
            optionsContainer.innerHTML = '';

            qData.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = "w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-3 px-4 rounded-xl text-left border-2 border-slate-300 transition-colors text-sm md:text-base";
                btn.innerText = opt.text;
                btn.onclick = () => handleAnswer(opt.correct);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(isCorrect) {
            const options = document.getElementById('dialog-options');
            if (isCorrect) {
                AudioEngine.playCorrect();
                const targetDest = document.getElementById(`dest-${currentDestinationIndex + 1}`);
                if (targetDest) targetDest.classList.add('visited', 'opacity-40');

                currentDestinationIndex++;
                document.getElementById('progress-ui').innerText = `📍 Destino: ${Math.min(currentDestinationIndex + 1, 4)} de 4`;

                if (currentDestinationIndex < questions.length) {
                    options.innerHTML = `
                        <p class="text-green-700 font-black text-xl mb-3">¡Respuesta Correcta! ⭐</p>
                        <button onclick="closeDialog()" class="btn-granate w-full font-bold py-3 px-4 rounded-xl text-lg uppercase">Avanzar al Siguiente Lugar ➡️</button>
                    `;
                } else {
                    showVictory();
                }
            } else {
                AudioEngine.playWrong();
                options.innerHTML = `
                    <p class="text-amber-800 font-bold text-lg mb-3">Inténtalo de nuevo. ¡Recuerda lo que nos enseña la historia!</p>
                    <button onclick="askQuestion(${currentDestinationIndex})" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-xl text-lg border-2 border-amber-700">Reintentar</button>
                `;
            }
        }

        function showVictory() {
            gameState = 'FINISHED';
            AudioEngine.playVictory();

            document.getElementById('dialog-overlay').classList.remove('hidden');
            document.getElementById('dialog-title').innerText = "🎉 ¡Felicitaciones! 🎉";
            document.getElementById('dialog-title').style.color = "var(--verde-prado)";

            document.getElementById('dialog-text').innerHTML = `
                El Grillito y la Señora Vaca recorrieron inolvidables lugares.<br><br>
                <div class="p-3 bg-amber-50 rounded-xl border-2 border-amber-300 my-2">
                    <span class="font-black text-amber-900 text-lg">"Porque nada hay imposible para Dios."</span><br>
                    <span class="font-bold text-amber-700 text-sm">(Lucas 1:37)</span>
                </div>
                Con esfuerzo, amistad, generosidad y fe, ¡puedes lograr todo lo que te propongas!
            `;

            const options = document.getElementById('dialog-options');
            options.innerHTML = `
                <button onclick="location.reload()" class="btn-granate w-full font-bold py-3 px-4 rounded-xl text-lg uppercase">🔄 Jugar de Nuevo</button>
            `;
        }

        function showMessage(title, text) {
            gameState = 'PAUSED';
            resetKeys();
            AudioEngine.playDialog();

            document.getElementById('dialog-overlay').classList.remove('hidden');
            document.getElementById('dialog-title').innerText = title;
            document.getElementById('dialog-text').innerHTML = text;

            const optionsContainer = document.getElementById('dialog-options');
            optionsContainer.innerHTML = `
                <button onclick="closeDialog()" class="btn-granate w-full font-bold py-3 px-4 rounded-xl text-lg uppercase">¡Entendido! 👍</button>
            `;
        }

        function closeDialog() {
            document.getElementById('dialog-overlay').classList.add('hidden');
            player.classList.remove('hopping');
            if (gameState !== 'FINISHED') {
                gameState = document.getElementById('level-title').innerText.includes("Nivel 2") ? 'LEVEL_2' : 'LEVEL_1';
            }
        }

        function resetKeys() {
            keys.ArrowUp = false; keys.ArrowDown = false; keys.ArrowLeft = false; keys.ArrowRight = false;
        }

        // Bucle del Juego
        requestAnimationFrame(gameLoop);
    </script><script>
    const fullscreenButton = document.getElementById('fullscreen-btn');

    fullscreenButton.addEventListener('click', async () => {
        const gameRoot = document.documentElement;

        try {
            if (!document.fullscreenElement) {
                if (gameRoot.requestFullscreen) {
                    await gameRoot.requestFullscreen();
                } else if (gameRoot.webkitRequestFullscreen) {
                    gameRoot.webkitRequestFullscreen();
                }
            } else if (document.exitFullscreen) {
                await document.exitFullscreen();
            }
        } catch (error) {
            console.log('Pantalla completa no disponible:', error);
        }
    });

    document.addEventListener('fullscreenchange', () => {
        fullscreenButton.textContent = document.fullscreenElement
            ? '✕ Salir de pantalla completa'
            : '⛶ Jugar a pantalla completa';
    });
</script>
